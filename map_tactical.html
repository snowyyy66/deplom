<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1127" height="783"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Фон — цвет земли
ctx.fillStyle = '#8B7355';
ctx.fillRect(0, 0, 1127, 783);

// Зелень по краям
ctx.fillStyle = '#5a7a3a';
ctx.fillRect(0, 0, 120, 783);
ctx.fillRect(1000, 0, 127, 783);
ctx.fillRect(0, 650, 1127, 133);
ctx.fillRect(0, 0, 1127, 50);

// ─── ВНЕШНИЙ КОНТУР ТРЕКА ────────────────────────────────────────────
ctx.strokeStyle = '#6b5a3a';
ctx.lineWidth = 18;
ctx.beginPath();
// Внешний прямоугольник со скруглёнными углами
ctx.roundRect(140, 60, 870, 700, 40);
ctx.stroke();
ctx.strokeStyle = '#7a6a4a';
ctx.lineWidth = 8;
ctx.beginPath();
ctx.roundRect(140, 60, 870, 700, 40);
ctx.stroke();

// ─── ВНУТРЕННИЙ ТРЕК (извилистый) ────────────────────────────────────
ctx.strokeStyle = '#6b5030';
ctx.lineWidth = 14;
// Серпантин в левой части
ctx.beginPath();
ctx.moveTo(370, 200);
ctx.bezierCurveTo(320, 280, 320, 320, 370, 360);
ctx.bezierCurveTo(420, 400, 380, 440, 330, 480);
ctx.bezierCurveTo(280, 520, 300, 560, 370, 580);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(450, 300);
ctx.bezierCurveTo(400, 350, 420, 400, 460, 430);
ctx.bezierCurveTo(500, 460, 480, 510, 440, 540);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(490, 330);
ctx.bezierCurveTo(450, 380, 460, 420, 500, 450);
ctx.bezierCurveTo(540, 480, 510, 530, 480, 560);
ctx.stroke();

// ─── ПОСТРОЙКИ ───────────────────────────────────────────────────────

// Круглая платформа (вверху-лево)
ctx.beginPath(); ctx.arc(355, 200, 38, 0, Math.PI*2);
ctx.fillStyle = '#aaa090'; ctx.fill();
ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.stroke();

// Прямоугольные постройки вверху-центр
ctx.fillStyle = '#b0a888';
ctx.fillRect(610, 100, 70, 45);
ctx.fillRect(690, 100, 50, 45);
ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
ctx.strokeRect(610, 100, 70, 45);
ctx.strokeRect(690, 100, 50, 45);

// Центральные постройки (главный объект)
ctx.fillStyle = '#c0b898';
ctx.fillRect(565, 285, 80, 120);
ctx.fillRect(660, 285, 75, 120);
ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
ctx.strokeRect(565, 285, 80, 120);
ctx.strokeRect(660, 285, 75, 120);

// Овальный ангар (правее)
ctx.beginPath(); ctx.ellipse(718, 487, 90, 42, 0, 0, Math.PI*2);
ctx.fillStyle = '#c8bfa0'; ctx.fill();
ctx.strokeStyle = '#888'; ctx.lineWidth = 2; ctx.stroke();

// Постройки низ-право
ctx.fillStyle = '#b8b098';
ctx.fillRect(820, 600, 80, 55);
ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
ctx.strokeRect(820, 600, 80, 55);

// Постройки лево-центр
ctx.fillStyle = '#aaa090';
ctx.fillRect(240, 320, 45, 35);
ctx.fillRect(240, 370, 45, 35);
ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
ctx.strokeRect(240, 320, 45, 35);
ctx.strokeRect(240, 370, 45, 35);

// Дорога снизу-лево
ctx.fillStyle = '#909090';
ctx.beginPath();
ctx.moveTo(0, 580); ctx.lineTo(130, 580);
ctx.lineTo(180, 650); ctx.lineTo(130, 720);
ctx.lineTo(0, 720); ctx.closePath(); ctx.fill();

// ════════════════════════════════════════════════════════════════
//                    ТАКТИЧЕСКИЕ ОБОЗНАЧЕНИЯ
// ════════════════════════════════════════════════════════════════

const label = (text, x, y, color, size = 13, bgAlpha = 0.7) => {
  ctx.font = `bold ${size}px Arial`;
  const w = ctx.measureText(text).width;
  ctx.fillStyle = `rgba(0,0,0,${bgAlpha})`;
  ctx.fillRect(x - 4, y - size + 1, w + 8, size + 5);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
};

const arrow = (x1, y1, x2, y2, color) => {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  ctx.setLineDash([10, 5]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 16*Math.cos(angle-0.4), y2 - 16*Math.sin(angle-0.4));
  ctx.lineTo(x2 - 16*Math.cos(angle+0.4), y2 - 16*Math.sin(angle+0.4));
  ctx.closePath(); ctx.fill();
};

// ── ЗОНЫ ──────────────────────────────────────────────────────

// 🔴 Снайперская платформа
ctx.beginPath(); ctx.arc(355, 200, 52, 0, Math.PI*2);
ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 3; ctx.stroke();
ctx.fillStyle = 'rgba(255,50,50,0.22)'; ctx.fill();
label('🔴 СНАЙПЕР ×2', 295, 165, '#ff6666', 13);
label('высотная точка, обзор центра', 258, 181, '#ffaaaa', 11);

// 🟠 Блок входа сверху
ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 3;
ctx.strokeRect(595, 88, 160, 70);
ctx.fillStyle = 'rgba(255,153,0,0.2)'; ctx.fillRect(595, 88, 160, 70);
label('🟠 БЛОК ВХОДА  3-4 чел', 540, 83, '#ffaa33', 13);
label('держат верхний въезд', 590, 168, '#ffcc88', 11);

// 🟢 Главный деф — центр
ctx.strokeStyle = '#00ee66'; ctx.lineWidth = 4;
ctx.strokeRect(548, 268, 200, 155);
ctx.fillStyle = 'rgba(0,220,80,0.18)'; ctx.fillRect(548, 268, 200, 155);
label('🟢 ГЛАВНЫЙ ДЕФ  8-10 чел', 478, 262, '#00ff88', 14);
label('закрытые углы, укрытия, ни хрена не пробить', 440, 278, '#aaffcc', 11);

// 🟡 Фланговый ангар
ctx.beginPath(); ctx.ellipse(718, 487, 105, 55, 0, 0, Math.PI*2);
ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 3; ctx.stroke();
ctx.fillStyle = 'rgba(255,238,0,0.2)'; ctx.fill();
label('🟡 ФЛАНГОВОЕ  4-5 чел', 565, 450, '#ffee33', 13);
label('прикрывают правый фланг и нижний въезд', 530, 466, '#ffeeaa', 11);

// 🔵 Резерв низ-право
ctx.strokeStyle = '#4499ff'; ctx.lineWidth = 3;
ctx.strokeRect(810, 590, 105, 75);
ctx.fillStyle = 'rgba(68,153,255,0.2)'; ctx.fillRect(810, 590, 105, 75);
label('🔵 РЕЗЕРВ  3 чел', 812, 585, '#88bbff', 13);
label('затыкают нижний прорыв', 730, 678, '#aaccff', 11);

// ── ЛИНИЯ ОБОРОНЫ ─────────────────────────────────────────────
ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 4;
ctx.setLineDash([14, 7]);
ctx.beginPath();
ctx.moveTo(420, 330); ctx.lineTo(548, 330);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(748, 330); ctx.lineTo(920, 330);
ctx.stroke();
ctx.setLineDash([]);
label('━━ ЛИНИЯ ОБОРОНЫ ━━', 460, 323, '#00ccff', 12);

// ── СТРЕЛКИ УГРОЗ ─────────────────────────────────────────────
arrow(155, 90, 310, 165, '#ff3333');
label('⚠ АТАКА', 130, 82, '#ff5555', 13);

arrow(900, 65, 750, 120, '#ff3333');
label('⚠ АТАКА', 870, 60, '#ff5555', 13);

arrow(150, 420, 300, 380, '#ff3333');
label('⚠ АТАКА', 80, 430, '#ff5555', 13);

arrow(600, 760, 600, 660, '#ff3333');
label('⚠ АТАКА', 530, 775, '#ff5555', 13);

arrow(970, 500, 870, 470, '#ff3333');
label('⚠ АТАКА', 960, 510, '#ff5555', 13);

// ── НУМЕРАЦИЯ ПОЗИЦИЙ ─────────────────────────────────────────
const num = (n, x, y, color) => {
  ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.font = 'bold 14px Arial';
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(n, x, y);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
};

num('1', 355, 200, '#ff6060');
num('2', 675, 123, '#ff9933');
num('3', 648, 346, '#00ee66');
num('4', 718, 487, '#ffee00');
num('5', 862, 628, '#4499ff');

// ── ЛЕГЕНДА ───────────────────────────────────────────────────
ctx.fillStyle = 'rgba(0,0,0,0.82)';
ctx.fillRect(8, 8, 300, 135);
ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
ctx.strokeRect(8, 8, 300, 135);

label('ТАКТИКА ОБОРОНЫ 32v32', 16, 28, '#ffffff', 14, 0);
label('① Снайпер ×2 — круглая платформа', 16, 48, '#ff8888', 12, 0);
label('② Блок входа 3-4 — верхние постройки', 16, 65, '#ffaa55', 12, 0);
label('③ Главный деф 8-10 — центр', 16, 82, '#66ffaa', 12, 0);
label('④ Фланговое 4-5 — ангар', 16, 99, '#ffee55', 12, 0);
label('⑤ Резерв 3 — нижний угол', 16, 116, '#88aaff', 12, 0);
label('⚠  Красные стрелки — откуда ждать врага', 16, 133, '#ff7777', 12, 0);
</script>
</body>
</html>
