services:
  postgres:
    image: postgres:16-alpine
    container_name: look_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: look
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d look"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - look_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: look_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/look?schema=public
      - GMAIL_ADDRESS=${GMAIL_ADDRESS:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-look-jwt-secret-dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-look-admin-2024}
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/menu > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - look_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: look_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - look_network

volumes:
  postgres_data:

networks:
  look_network:
    driver: bridge
